# The whole app is one OneBase executable (backend, AI calls and the built web app). One-time setup is in the README, then:
#   fly deploy
# Change `app` to a name nobody has taken, and keep the two URLs below in step with it.
# OPENROUTER_API_KEY and ONEBASE_ADMIN_KEY are secrets: `fly secrets set ...`
app = "infinite-learning"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  ONEBASE_URL = "https://infinite-learning.fly.dev"
  APP_URL = "https://infinite-learning.fly.dev"
  ONEBASE_RATE_LIMIT = "300/m"

# SQLite lives here.
[mounts]
  source = "infinite_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # SQLite allows one writer, so run exactly one machine. Keep it up so live queries stay connected.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 1000
    hard_limit = 2000

  [[http_service.checks]]
    method = "GET"
    path = "/api/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
