<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Infinite Learning: a short course on anything</title>
    <meta name="description" content="Type any topic and an AI writes you a short course with lessons and quizzes, in about a minute. No account." />
    <meta name="theme-color" content="#1423b8" />
    <link rel="preconnect" href="https://api.fontshare.com" />
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin="anonymous" />
    <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=pilcrow-rounded@400,500,700&display=swap" />
    <!-- the Arabic face; the browser only downloads it for pages that use Arabic -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;700&display=swap" />
    <!-- `js` lets entrances hide content; the language and direction are set before first paint so
         an Arabic reader never sees the page flip -->
    <script>
      (function (d) {
        d.classList.add("js");
        try {
          var s = JSON.parse(localStorage.getItem("il.settings") || "{}");
          var l = s.ui || ((navigator.language || "").slice(0, 2) == "ar" ? "ar" : "en");
          if (l == "ar") {
            d.lang = "ar";
            d.dir = "rtl";
          }
        } catch (e) {}
      })(document.documentElement);
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
